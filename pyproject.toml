[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-tumor-segmentation"
version = "0.1.0"

[project.scripts]
app = "src.inference.predict:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "src.inference.predict:app"
